name: Build Android APK

# 앱 화면(www/)이나 안드로이드 설정이 바뀌면 APK를 자동으로 빌드해
# 저장소의 Releases(태그: android-latest)에 올립니다.
# 휴대폰에서 Releases 페이지를 열어 APK를 받아 바로 설치할 수 있습니다.
on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web files into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist
          cp "$apk" "dist/malsseum-barochatgi.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: malsseum-barochatgi-apk
          path: dist/malsseum-barochatgi.apk

      - name: Publish to Releases (android-latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=android-latest
          notes="말씀 바로찾기 안드로이드 앱 1.0.${{ github.run_number }} (커밋 ${GITHUB_SHA::7})

          설치: 휴대폰에서 아래 malsseum-barochatgi.apk 를 눌러 받은 뒤 열기 → '출처를 알 수 없는 앱 설치' 허용 → 설치"
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "안드로이드 앱 (최신)" --notes "$notes" --latest
            gh release upload "$tag" dist/malsseum-barochatgi.apk --clobber
          else
            gh release create "$tag" dist/malsseum-barochatgi.apk --title "안드로이드 앱 (최신)" --notes "$notes" --latest
          fi
